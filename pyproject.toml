[project]
name = "firm-ai"
version = "0.1.0"
description = "Local-first desktop AI assistant for internal firm use"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.80",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pypdf>=4.0",
    "pypdfium2==5.13.0",
    "reportlab>=4.0",
    "python-docx>=1.1",
    "pyside6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
almond = "almond_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "src/almond_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
