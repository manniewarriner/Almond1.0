<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#F15A24" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#F15A24" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F15A24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#F4C88C"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="#10131A"/>
  <circle cx="128" cy="128" r="98" fill="url(#glow)"/>

  <!-- Assistant/bot glyph: rounded head, antenna, two eyes and a mouth,
       punched through in the background colour, using the same orange
