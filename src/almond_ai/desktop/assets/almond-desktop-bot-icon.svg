  <circle cx="128" cy="44" r="11" fill="url(#markFill)"/>
  <rect x="66" y="76" width="124" height="102" rx="27" fill="url(#markFill)"/>
  <circle cx="103" cy="122" r="12" fill="#10131A"/>
  <circle cx="153" cy="122" r="12" fill="#10131A"/>
  <rect x="106" y="147" width="44" height="11" rx="5.5" fill="#10131A"/>
  <rect x="40" y="112" width="16" height="36" rx="8" fill="url(#markFill)"/>
  <rect x="200" y="112" width="16" height="36" rx="8" fill="url(#markFill)"/>
</svg>
